name: Fetch Arvis timesheet
# Fetches an Arvis page from a GitHub runner and prints it ONLY in encrypted form.
# The repo is public, so the page body is encrypted to .github/fetch/pubkey.pem.
on:
  push:
    branches: [claude/friendly-lovelace-y9kzfr]
    paths: [.github/fetch/request.txt, .github/workflows/fetch-timesheet.yml]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and encrypt
        run: |
          URL="$(head -n1 .github/fetch/request.txt)"
          curl -sS -L -m 60 -o body.bin -D headers.txt -w 'HTTP_STATUS=%{http_code}\n' "$URL" || echo "CURL_FAILED"
          touch body.bin headers.txt
          echo "BODY_BYTES=$(stat -c %s body.bin)"
          tar czf bundle.tgz body.bin headers.txt
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.tgz -out bundle.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/fetch/pubkey.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          echo "-----BEGIN KEY-----"; base64 -w 76 k.enc; echo "-----END KEY-----"
          echo "-----BEGIN DATA-----"; base64 -w 76 bundle.enc; echo "-----END DATA-----"
          rm -f body.bin headers.txt bundle.tgz k.bin
